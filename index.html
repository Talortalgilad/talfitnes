<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F4">
<title>בוקר · כושר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F7F4; --paper:#FFFFFF; --ink:#141A24; --ink-2:#5B6472; --line:#E6E7E2;
    --accent:#2457F5; --accent-soft:#E7EDFF; --rest:#18A66B; --rest-soft:#E3F6EC; --warn:#E8552E;
    --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
  button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  main{flex:1;padding:24px 20px 96px}
  .hide{display:none!important}

  /* ---------- home ---------- */
  .date{color:var(--ink-2);font-size:15px}
  h1{font-size:34px;font-weight:900;line-height:1.1;margin-top:6px;letter-spacing:-.01em}
  h1 small{display:block;font-size:17px;font-weight:500;color:var(--ink-2);margin-top:6px}
  .stats{display:flex;gap:10px;margin:22px 0 8px}
  .stat{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
  .stat b{display:block;font-size:26px;font-weight:900;line-height:1}
  .stat span{font-size:13px;color:var(--ink-2)}
  .days{display:flex;gap:8px;margin:18px 0 12px}
  .days button{flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:15px;color:var(--ink-2)}
  .days button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .plan{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .plan .row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line)}
  .plan .row:first-child{border-top:0}
  .plan .row .n{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
  .plan .row .t{flex:1;min-width:0}
  .plan .row .t b{display:block;font-weight:700;font-size:16px}
  .plan .row .t span{font-size:13px;color:var(--ink-2)}
  .plan .row .lvl{font-size:12px;color:var(--ink-2);background:var(--bg);border-radius:999px;padding:4px 10px;white-space:nowrap}
  .plan .row.dim{opacity:.55}
  .cta{position:fixed;left:0;right:0;bottom:64px;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);max-width:520px;margin:0 auto}
  .btn{width:100%;padding:18px;border-radius:16px;background:var(--accent);color:#fff;font-size:19px;font-weight:900}
  .btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
  .btn:active{transform:scale(.985)}

  /* ---------- nav ---------- */
  nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--paper);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;padding:10px 0 8px;font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:4px}
  nav button.on{color:var(--ink);font-weight:700}
  nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- workout ---------- */
  #workout{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));transition:background .35s}
  #workout.rest{background:var(--rest-soft)}
  #workout.work{background:var(--bg)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .top .close{width:40px;height:40px;border-radius:12px;background:var(--paper);border:1px solid var(--line);font-size:20px}
  .prog{flex:1;height:5px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
  .prog i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
  .top .count{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .phase{margin-top:26px;font-size:15px;color:var(--ink-2);font-weight:500}
  .exname{font-size:30px;font-weight:900;line-height:1.15;margin-top:4px}
  .exsub{font-size:16px;color:var(--ink-2);margin-top:6px}
  .stage{flex:1;display:grid;place-items:center;min-height:180px}
  .figure{width:min(70vw,260px);aspect-ratio:1;display:grid;place-items:center;position:relative}
  .figure svg{width:100%;height:100%;overflow:visible}
  .figure .badge{position:absolute;bottom:4px;font-size:11px;color:var(--ink-2);background:rgba(255,255,255,.7);padding:3px 8px;border-radius:99px}
  .ring{position:relative;width:min(64vw,250px);aspect-ratio:1;display:grid;place-items:center}
  .ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:9;stroke-linecap:round}
  .ring .bg{stroke:rgba(0,0,0,.07)}
  .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .95s linear}
  #workout.rest .ring .fg{stroke:var(--rest)}
  .time{font-size:72px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
  .reps{font-size:88px;font-weight:900;line-height:1;letter-spacing:-.03em}
  .reps small{display:block;font-size:17px;font-weight:500;color:var(--ink-2);margin-top:8px;letter-spacing:0}
  .cues{list-style:none;margin:14px 0 0;display:flex;flex-direction:column;gap:6px}
  .cues li{font-size:15px;color:var(--ink-2);padding-right:14px;position:relative}
  .cues li::before{content:"";position:absolute;right:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .next{margin-top:14px;font-size:14px;color:var(--ink-2)}
  .next b{color:var(--ink)}
  .ctrl{display:flex;gap:10px;margin-top:18px}
  .ctrl .btn{padding:16px}
  .ctrl .sq{width:64px;flex:none;border-radius:16px;background:var(--paper);border:1px solid var(--line);font-size:22px}

  /* ---------- done ---------- */
  .done h1{margin-top:40px}
  .rpe{display:flex;gap:8px;margin:24px 0 10px}
  .rpe button{flex:1;aspect-ratio:1;border-radius:14px;background:var(--paper);border:1px solid var(--line);font-size:24px;font-weight:900}
  .rpe button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .rpe-l{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-bottom:26px}
  .note{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;font-size:15px;line-height:1.5;color:var(--ink-2)}
  .note b{color:var(--ink)}

  .empty{padding:60px 0;text-align:center;color:var(--ink-2);font-size:16px;line-height:1.6}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- ============ HOME ============ -->
  <main id="home">
    <div class="date" id="today"></div>
    <h1 id="dayTitle"></h1>
    <div class="stats">
      <div class="stat"><b id="sStreak">0</b><span>ימי רצף</span></div>
      <div class="stat"><b id="sTotal">0</b><span>אימונים</span></div>
      <div class="stat"><b id="sMin">0</b><span>דקות השבוע</span></div>
    </div>
    <div class="days" id="dayPick"></div>
    <div class="plan" id="planList"></div>
  </main>
  <div class="cta" id="homeCta"><button class="btn" id="startBtn">התחל אימון</button></div>

  <main id="tabOther" class="hide"><div class="empty" id="otherText"></div></main>

  <!-- ============ WORKOUT ============ -->
  <section id="workout" class="hide">
    <div class="top">
      <button class="close" id="quitBtn" aria-label="יציאה">✕</button>
      <div class="prog"><i id="progBar"></i></div>
      <span class="count" id="stepCount"></span>
    </div>
    <div class="phase" id="phase"></div>
    <div class="exname" id="exName"></div>
    <div class="exsub" id="exSub"></div>
    <div class="stage" id="stage"></div>
    <ul class="cues" id="cues"></ul>
    <div class="next" id="nextUp"></div>
    <div class="ctrl">
      <button class="btn" id="mainBtn">סיימתי את הסט</button>
      <button class="sq" id="pauseBtn" aria-label="השהיה">⏸</button>
    </div>
  </section>

  <!-- ============ DONE ============ -->
  <main id="done" class="hide done">
    <div class="date">כל הכבוד</div>
    <h1>האימון הושלם<small id="doneSub"></small></h1>
    <div class="phase" style="margin-top:28px">כמה קשה היה?</div>
    <div class="rpe" id="rpe"></div>
    <div class="rpe-l"><span>קל מדי</span><span>בדיוק</span><span>קשה מדי</span></div>
    <div class="note" id="doneNote"></div>
  </main>
  <div class="cta hide" id="doneCta"><button class="btn" id="saveBtn">שמור וסיים</button></div>

  <nav id="nav">
    <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M4 12h4l3-8 4 16 3-8h2"/></svg>היום</button>
    <button data-tab="lib"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></svg>תרגילים</button>
    <button data-tab="track"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M7 15l4-5 3 3 5-7"/></svg>מעקב</button>
    <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>הגדרות</button>
  </nav>
</div>

<script>
/* ==================================================
   PROGRAM DATA
   Every exercise has 5 levels. Level 1 is the entry point after a long break.
   mode: 'reps' -> user taps when set is done; 'time' -> countdown.
   ================================================== */
const REST = 45;          // rest between sets on strength days (sec)
const CIRCUIT = {work:40, rest:20, rounds:3};

const EX = {
  // ---- Day A: push + legs ----
  pushup:{name:'שכיבות סמיכה', mode:'reps', sets:3, reps:[8,10,10,10,10],
    levels:['ידיים על הקיר','ידיים על משענת הכיסא','על הברכיים','מלאה על המזרן','רגליים על הכיסא'],
    cues:['גוף בקו ישר מהראש לעקבים','מרפקים בזווית 45° מהגוף','לרדת לאט, לעלות בכוח'], fig:'push'},
  squat:{name:'סקוואט', mode:'reps', sets:3, reps:[10,12,12,12,10],
    levels:['ישיבה וקימה מהכיסא','סקוואט עד נגיעה בכיסא','סקוואט חופשי','עם המשקולות ליד החזה','עצירה של 3 שניות למטה'],
    cues:['משקל על העקבים','ברכיים בכיוון האצבעות','חזה פתוח, מבט קדימה'], fig:'squat'},
  lunge:{name:'לאנג\'ים', mode:'reps', sets:3, reps:[6,8,8,10,8], perSide:true,
    levels:['לאנג\' לאחור עם אחיזה בסולם','לאנג\' לאחור','לאנג\' קדימה','עם המשקולות בידיים','רגל אחורית על הכיסא'],
    cues:['הברך הקדמית מעל הקרסול','גו זקוף','לרדת עד שהברך האחורית כמעט נוגעת'], fig:'lunge'},
  shoulder:{name:'כתפיים עם משקולות', mode:'reps', sets:3, reps:[12,12,12,10,8],
    levels:['הרמות צד','הרמות צד + הרמות קדמיות','לחיצת כתפיים מעל הראש','לחיצה + הרמות צד ברצף','פייק פוש-אפ (ירכיים למעלה)'],
    cues:['בטן אסופה, לא לקשת את הגב','תנועה איטית ומבוקרת','כתפיים רחוקות מהאוזניים'], fig:'shoulder'},

  // ---- Day B: pull + core ----
  row:{name:'חתירה בסולם השוודי', mode:'reps', sets:3, reps:[8,8,10,10,10],
    levels:['אחיזה בשלב גבוה, גוף כמעט זקוף','שלב נמוך יותר, גוף נוטה','גוף ב-45 מעלות','גוף כמעט אופקי','רגליים על הכיסא'],
    cues:['למשוך את החזה אל השלב','לכווץ את השכמות','הגוף נשאר קו ישר'], fig:'row'},
  hang:{name:'תלייה על מוט הקופים', mode:'time', sets:3, time:[10,20,30,45,45],
    levels:['תלייה 10 שניות','תלייה 20 שניות','תלייה 30 שניות','תלייה 45 שניות','תלייה + הרמות ברכיים'],
    cues:['כתפיים פעילות, לא "לתלות" על המפרקים','אחיזה מלאה עם האגודל','נשימה רגועה'], fig:'hang'},
  plank:{name:'פלאנק', mode:'time', sets:3, time:[20,30,40,60,45],
    levels:['על הברכיים','על האמות, 30 שניות','40 שניות','60 שניות','פלאנק צד, כל צד'],
    cues:['אגן מכווץ, לא לשקוע','מרפקים מתחת לכתפיים','לדחוף את הרצפה עם האמות'], fig:'plank'},
  legraise:{name:'הרמות רגליים בסולם', mode:'reps', sets:3, reps:[8,8,10,10,8],
    levels:['הרמות ברכיים בעמידה עם אחיזה','רגליים על שלב, הרמת ברך אחת','תלייה והרמת ברכיים','רגליים ישרות עד 90 מעלות','רגליים ישרות עד השלב העליון'],
    cues:['לא להתנדנד','לנשוף בעלייה','לרדת לאט'], fig:'legraise'},

  // ---- Day C: circuit ----
  jacks:{name:'ג\'אמפינג ג\'קס', mode:'circuit',
    levels:['סטפ-ג\'קס (בלי קפיצה)','קצב איטי','קצב רגיל','קצב מהיר','עם המשקולות בידיים'],
    cues:['נחיתה רכה על כריות הרגליים','ידיים מגיעות עד מעל הראש'], fig:'jacks'},
  stepup:{name:'עליות על הכיסא', mode:'circuit',
    levels:['על מדרגה נמוכה / שלב תחתון','על הכיסא, לאט','על הכיסא, קצב רגיל','עם ברך למעלה בסיום','עם המשקולות'],
    cues:['לדחוף מהעקב של הרגל העליונה','להחליף רגל מובילה בכל סבב','לוודא שהכיסא יציב על הרצפה'], fig:'stepup'},
  climber:{name:'טיפוס הרים', mode:'circuit',
    levels:['ידיים על הכיסא, לאט','ידיים על הכיסא','על הרצפה, לאט','על הרצפה, קצב רגיל','קצב מהיר'],
    cues:['כתפיים מעל כפות הידיים','אגן נשאר נמוך','ברך אל החזה'], fig:'climber'},
  burpee:{name:'ברפי', mode:'circuit',
    levels:['ידיים על הכיסא, בלי קפיצה','על הרצפה, בלי קפיצה','עם קפיצה קטנה','עם שכיבת סמיכה','מלא, קצב'],
    cues:['לרדת בשליטה, לא לזרוק את הגוף','גב ישר בשלב הפלאנק'], fig:'burpee'},
  knees:{name:'הרמות ברכיים במקום', mode:'circuit',
    levels:['הליכה במקום עם ברך גבוהה','קצב איטי','קצב רגיל','ריצה עם ברכיים גבוהות','ידיים מעל הראש'],
    cues:['ברך לגובה הירך','בטן אסופה, גו זקוף'], fig:'knees'},
  thruster:{name:'סקוואט + לחיצה מעל הראש', mode:'circuit',
    levels:['סקוואט לכיסא + לחיצה בלי משקל','עם המשקולות, לאט','עם המשקולות, קצב רגיל','סקוואט עמוק יותר','קצב מהיר'],
    cues:['תנועה אחת רציפה מלמטה למעלה','לנשוף בלחיצה'], fig:'thruster'},

  // ---- Day D: mobility ----
  catcow:{name:'חתול-גמל', mode:'mob', levels:['על המזרן, 45 שניות','','','',''],
    cues:['לנשום עמוק בכל תנועה','לנוע חוליה-חוליה'], fig:'catcow'},
  chest:{name:'פתיחת חזה בסולם', mode:'mob', levels:['ידיים על שלב, גוף נוטה קדימה','','','',''],
    cues:['ידיים בגובה הכתפיים','להוריד את החזה בין הזרועות'], fig:'chest'},
  hipflex:{name:'מתיחת ירך בכריעה', mode:'mob', levels:['ברך על המזרן, אגן קדימה','','','',''],
    cues:['לכווץ את הישבן של הרגל האחורית','לא לקשת את הגב'], fig:'hipflex'},
  hamstring:{name:'מתיחת ירך אחורית', mode:'mob', levels:['עקב על שלב תחתון, גו ישר','','','',''],
    cues:['להתקפל מהירכיים, לא מהגב','ברך רכה'], fig:'hamstring'},
  twist:{name:'פיתול עמוד שדרה בשכיבה', mode:'mob', levels:['על הגב, ברכיים לצד','','','',''],
    cues:['שתי הכתפיים על המזרן','נשימה איטית'], fig:'twist'},
  deadhang:{name:'תלייה פסיבית', mode:'mob', levels:['על מוט הקופים, כתפיים רפויות','','','',''],
    cues:['לתת לגב להתארך','לרדת ברגע שהאחיזה נחלשת'], fig:'hang'},
  breath:{name:'נשימה', mode:'mob', levels:['שכיבה על הגב, 4 שניות פנימה, 6 החוצה','','','',''],
    cues:['יד על הבטן','הבטן עולה לפני החזה'], fig:'breath'},
};

const WARMUP = [
  {name:'הליכה במקום', time:60, cues:['להניף ידיים','לנשום דרך האף'], fig:'knees'},
  {name:'סיבובי זרועות', time:30, cues:['15 שניות קדימה, 15 אחורה'], fig:'shoulder'},
  {name:'סיבובי אגן', time:30, cues:['עיגולים גדולים לשני הכיוונים'], fig:'catcow'},
  {name:'סקוואט איטי', time:30, cues:['רק כמה שנוח, בלי משקל'], fig:'squat'},
  {name:'חתול-גמל', time:30, cues:['להעיר את עמוד השדרה'], fig:'catcow'},
];
const COOLDOWN = [
  {name:'מתיחת ירך בכריעה', time:30, cues:['15 שניות כל צד'], fig:'hipflex'},
  {name:'מתיחת ירך אחורית', time:30, cues:['15 שניות כל צד'], fig:'hamstring'},
  {name:'פתיחת חזה בסולם', time:30, cues:['לנשום לתוך החזה'], fig:'chest'},
  {name:'נשימה', time:30, cues:['4 פנימה, 6 החוצה'], fig:'breath'},
];

const DAYS = [
  {key:'A', title:'דחיפה ורגליים', ex:['pushup','squat','lunge','shoulder']},
  {key:'B', title:'משיכה וליבה', ex:['row','hang','plank','legraise']},
  {key:'C', title:'מעגל לדופק', ex:['jacks','stepup','climber','burpee','knees','thruster']},
  {key:'D', title:'ניידות ושחרור', ex:['catcow','chest','hipflex','hamstring','twist','deadhang','breath']},
];

/* ==================================================
   STORAGE
   ================================================== */
const KEY='fit.v1';
const store = load();
function load(){
  try{ return Object.assign({levels:{}, sessions:[], weights:[], settings:{reminder:'07:45'}}, JSON.parse(localStorage.getItem(KEY)||'{}')); }
  catch(e){ return {levels:{}, sessions:[], weights:[], settings:{reminder:'07:45'}}; }
}
const save = ()=>localStorage.setItem(KEY, JSON.stringify(store));
const lvl = id => store.levels[id] || 1;

   FIGURES (placeholders until step 2 animations)

/* ==================================================
   HOME
   ================================================== */
const $ = s=>document.querySelector(s);
const HE_DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
let selDay = nextDayIndex();

function nextDayIndex(){
  const last = store.sessions[store.sessions.length-1];
  return last ? (DAYS.findIndex(d=>d.key===last.day)+1)%4 : 0;
}
function exDesc(id){
  const e=EX[id], L=lvl(id);
  if(e.mode==='reps') return `${e.sets} סטים × ${e.reps[L-1]}${e.perSide?' לכל צד':''}`;
  if(e.mode==='time') return `${e.sets} סטים × ${e.time[L-1]} שנ׳`;
  if(e.mode==='circuit') return `${CIRCUIT.rounds} סבבים × ${CIRCUIT.work} שנ׳`;
  return '45 שנ׳';
}
function estMinutes(d){
  let s = 300; // warmup+cooldown
  d.ex.forEach(id=>{const e=EX[id];
    if(e.mode==='reps') s+=e.sets*(35+REST);
    else if(e.mode==='time') s+=e.sets*(e.time[lvl(id)-1]+REST);
    else if(e.mode==='circuit') s+=CIRCUIT.rounds*(CIRCUIT.work+CIRCUIT.rest);
    else s+=50;});
  return Math.round(s/60);
}
function renderHome(){
  const now=new Date();
  $('#today').textContent=`יום ${HE_DAYS[now.getDay()]}, ${now.getDate()}.${now.getMonth()+1}`;
  const d=DAYS[selDay];
  $('#dayTitle').innerHTML=`יום ${d.key} · ${d.title}<small>כ-${estMinutes(d)} דקות · כולל חימום ושחרור</small>`;
  $('#dayPick').innerHTML=DAYS.map((x,i)=>`<button class="${i===selDay?'on':''}" data-i="${i}">${x.key}</button>`).join('');
  $('#dayPick').querySelectorAll('button').forEach(b=>b.onclick=()=>{selDay=+b.dataset.i;renderHome();});
  $('#planList').innerHTML =
    `<div class="row dim"><div class="n">▲</div><div class="t"><b>חימום</b><span>3 דקות</span></div></div>` +
    d.ex.map((id,i)=>`<div class="row"><div class="n">${i+1}</div><div class="t"><b>${EX[id].name}</b><span>${exDesc(id)}</span></div>${EX[id].mode==='mob'?'':`<span class="lvl">רמה ${lvl(id)} · ${EX[id].levels[lvl(id)-1]}</span>`}</div>`).join('') +
    `<div class="row dim"><div class="n">▼</div><div class="t"><b>שחרור</b><span>2 דקות</span></div></div>`;
  // stats
  $('#sTotal').textContent=store.sessions.length;
  $('#sStreak').textContent=streak();
  const weekAgo=Date.now()-7*864e5;
  $('#sMin').textContent=store.sessions.filter(s=>new Date(s.date)>weekAgo).reduce((a,s)=>a+s.minutes,0);
}
function streak(){
  const days=[...new Set(store.sessions.map(s=>s.date.slice(0,10)))].sort().reverse();
  if(!days.length) return 0;
  let n=0, cur=new Date(); cur.setHours(0,0,0,0);
  const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  if(days[0]!==iso(cur)){ cur.setDate(cur.getDate()-1); if(days[0]!==iso(cur)) return 0; }
  for(const d of days){ if(d===iso(cur)){n++; cur.setDate(cur.getDate()-1);} else break; }
  return n;
}

/* ==================================================
   WORKOUT ENGINE
   ================================================== */
let steps=[], idx=0, timer=null, remain=0, total=0, paused=false, startedAt=0, wakeLock=null;

function buildSteps(d){
  const S=[];
  WARMUP.forEach(w=>S.push({kind:'work', phase:'חימום', name:w.name, sub:'', cues:w.cues, fig:w.fig, mode:'time', secs:w.time}));
  const ex=d.ex;
  if(d.key==='C'){
    for(let r=1;r<=CIRCUIT.rounds;r++) ex.forEach((id,i)=>{
      const e=EX[id], L=lvl(id);
      S.push({kind:'work', phase:`סבב ${r} מתוך ${CIRCUIT.rounds}`, name:e.name, sub:`רמה ${L} · ${e.levels[L-1]}`, cues:e.cues, fig:e.fig, mode:'time', secs:CIRCUIT.work});
      if(!(r===CIRCUIT.rounds && i===ex.length-1)) S.push({kind:'rest', secs:CIRCUIT.rest});
    });
  } else if(d.key==='D'){
    ex.forEach(id=>{const e=EX[id]; S.push({kind:'work', phase:'ניידות', name:e.name, sub:e.levels[0], cues:e.cues, fig:e.fig, mode:'time', secs:45});});
  } else {
    ex.forEach((id,i)=>{const e=EX[id], L=lvl(id);
      for(let s=1;s<=e.sets;s++){
        const st={kind:'work', phase:`תרגיל ${i+1} מתוך ${ex.length} · סט ${s} מתוך ${e.sets}`, name:e.name, sub:`רמה ${L} · ${e.levels[L-1]}`, cues:e.cues, fig:e.fig, mode:e.mode};
        if(e.mode==='time') st.secs=e.time[L-1]; else st.reps=e.reps[L-1], st.perSide=!!e.perSide;
        S.push(st);
        if(!(i===ex.length-1 && s===e.sets)) S.push({kind:'rest', secs:REST});
      }});
  }
  COOLDOWN.forEach(c=>S.push({kind:'work', phase:'שחרור', name:c.name, sub:'', cues:c.cues, fig:c.fig, mode:'time', secs:c.time}));
  return S;
}

function startWorkout(){
  steps=buildSteps(DAYS[selDay]); idx=0; startedAt=Date.now();
  $('#workout').classList.remove('hide'); $('#home').classList.add('hide'); $('#homeCta').classList.add('hide'); $('#nav').classList.add('hide');
  navigator.wakeLock?.request('screen').then(w=>wakeLock=w).catch(()=>{});
  showStep();
}
function showStep(){
  clearInterval(timer); paused=false; $('#pauseBtn').textContent='⏸';
  if(idx>=steps.length) return finish();
  const st=steps[idx], w=$('#workout');
  w.classList.toggle('rest', st.kind==='rest'); w.classList.toggle('work', st.kind!=='rest');
  $('#progBar').style.width=(idx/steps.length*100)+'%';
  $('#stepCount').textContent=`${idx+1}/${steps.length}`;
  const nxt=steps.slice(idx+1).find(s=>s.kind==='work');
  $('#nextUp').innerHTML = nxt ? `הבא: <b>${nxt.name}</b>` : 'זה האחרון';
  if(st.kind==='rest'){
    $('#phase').textContent='מנוחה'; $('#exName').textContent='נשום'; $('#exSub').textContent='';
    $('#cues').innerHTML=''; $('#mainBtn').textContent='דלג על המנוחה';
    startCountdown(st.secs);
  } else {
    $('#phase').textContent=st.phase; $('#exName').textContent=st.name; $('#exSub').textContent=st.sub;
    $('#cues').innerHTML=st.cues.map(c=>`<li>${c}</li>`).join('');
    if(st.mode==='time'){ $('#mainBtn').textContent='דלג'; startCountdown(st.secs, st.fig); }
    else { $('#stage').innerHTML=`<div class="reps">${st.reps}<small>חזרות${st.perSide?' לכל צד':''}</small></div>`+figure(st.fig); $('#mainBtn').textContent='סיימתי את הסט'; }
  }
}
function ringHTML(){return `<div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="ringFg" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="time" id="timeTxt"></div></div>`;}
function startCountdown(secs, fig){
  remain=secs; total=secs;
  $('#stage').innerHTML = (fig?figure(fig):'') + ringHTML();
  if(fig) $('#stage').style.gridTemplateColumns='1fr 1fr'; else $('#stage').style.gridTemplateColumns='';
  paint();
  timer=setInterval(()=>{ if(paused) return; remain--; paint();
    if(remain<=3 && remain>0) beep(660,.08);
    if(remain<=0){ clearInterval(timer); beep(880,.25); idx++; showStep(); } },1000);
}
function paint(){
  const t=$('#timeTxt'); if(!t) return;
  t.textContent = remain>=60 ? `${Math.floor(remain/60)}:${String(remain%60).padStart(2,'0')}` : remain;
  $('#ringFg').style.strokeDashoffset = 276.5*(1-remain/total);
}
$('#mainBtn').onclick=()=>{ clearInterval(timer); beep(880,.15); idx++; showStep(); };
$('#pauseBtn').onclick=()=>{ paused=!paused; $('#pauseBtn').textContent=paused?'▶':'⏸'; };
$('#quitBtn').onclick=()=>{ if(confirm('לצאת מהאימון? ההתקדמות לא תישמר.')) { clearInterval(timer); wakeLock?.release(); $('#workout').classList.add('hide'); showTab('home'); } };

/* ---------- audio ---------- */
let ac; function beep(f,d){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=f; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.15,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d); o.start(); o.stop(ac.currentTime+d);}catch(e){} }

/* ==================================================
   DONE + RPE + PROGRESSION
   ================================================== */
let rpe=0;
function finish(){
  wakeLock?.release();
  $('#workout').classList.add('hide'); $('#done').classList.remove('hide'); $('#doneCta').classList.remove('hide');
  const d=DAYS[selDay], mins=Math.max(1,Math.round((Date.now()-startedAt)/6e4));
  $('#doneSub').textContent=`יום ${d.key} · ${d.title} · ${mins} דקות`;
  $('#rpe').innerHTML=[1,2,3,4,5].map(n=>`<button data-n="${n}">${n}</button>`).join('');
  $('#rpe').querySelectorAll('button').forEach(b=>b.onclick=()=>{rpe=+b.dataset.n; $('#rpe').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); $('#doneNote').innerHTML=noteFor(rpe);});
  rpe=0; $('#doneNote').innerHTML='דרג את הקושי ומכאן האפליקציה מחליטה מתי לעלות רמה.';
}
function noteFor(n){
  const d=DAYS[selDay];
  const prev=[...store.sessions].reverse().find(s=>s.day===d.key);
  if(n<=2 && prev && prev.rpe<=2) return `<b>עולים רמה.</b> זה האימון השני ברצף שהיה קל ביום ${d.key}, אז בפעם הבאה כל התרגילים של היום הזה יהיו רמה אחת למעלה.`;
  if(n<=2) return 'קל? עוד אימון קל אחד ביום הזה ואתה עולה רמה.';
  if(n===5) return '<b>יורדים רמה.</b> קשה מדי זה לא מטרה – בפעם הבאה היום הזה יהיה רמה אחת למטה.';
  return 'בדיוק המקום הנכון. ממשיכים ככה.';
}
$('#saveBtn').onclick=()=>{
  if(!rpe) return alert('דרג את הקושי קודם');
  const d=DAYS[selDay];
  const prev=[...store.sessions].reverse().find(s=>s.day===d.key);
  if(d.key!=='D'){
    if(rpe<=2 && prev && prev.rpe<=2) d.ex.forEach(id=>store.levels[id]=Math.min(5,lvl(id)+1));
    if(rpe===5) d.ex.forEach(id=>store.levels[id]=Math.max(1,lvl(id)-1));
  }
  store.sessions.push({date:new Date().toISOString(), day:d.key, rpe, minutes:Math.max(1,Math.round((Date.now()-startedAt)/6e4))});
  save(); selDay=nextDayIndex();
  $('#done').classList.add('hide'); $('#doneCta').classList.add('hide'); showTab('home');
};

/* ==================================================
   NAV
   ================================================== */
const OTHER={lib:'ספריית התרגילים עם האנימציות<br>מגיעה בשלב 2.', track:'שקילה שבועית, גרף ורצף<br>מגיעים בשלב 3.', set:'שעת תזכורת (07:45) והגדרות<br>מגיעות בשלב 4.'};
function showTab(t){
  $('#nav').classList.remove('hide');
  $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  const home=t==='home';
  $('#home').classList.toggle('hide',!home); $('#homeCta').classList.toggle('hide',!home); $('#tabOther').classList.toggle('hide',home);
  if(home) renderHome(); else $('#otherText').innerHTML=OTHER[t];
}
$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$('#startBtn').onclick=startWorkout;
renderHome();
</script>
